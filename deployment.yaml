apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubernetes-devops-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: kubernetes-devops-app

  template:
    metadata:
      labels:
        app: kubernetes-devops-app

    spec:
      containers:
        - name: kubernetes-devops-container
          image: kubernetes-devops-app:v2
          imagePullPolicy: Never
          ports:
            - containerPort: 80